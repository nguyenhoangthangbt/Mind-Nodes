version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
    command: uvicorn leadlocal.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadlocal
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: leadlocal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadlocal"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: ./api/.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./api/src:/app/src
    command: celery -A leadlocal.tasks.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: ./api/.env
    depends_on:
      - redis
    volumes:
      - ./api/src:/app/src
    command: celery -A leadlocal.tasks.celery_app beat --loglevel=info

volumes:
  pgdata:
